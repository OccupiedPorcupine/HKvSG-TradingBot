# =============================================================================
# APEX — Autonomous Portfolio Execution Agent
# Configuration File v3.2
#
# ALL tunable strategy parameters live here. Never hardcode values in logic.
# Every parameter change during competition must be a committed config change.
# =============================================================================

# -----------------------------------------------------------------------------
# COMPETITION
# -----------------------------------------------------------------------------
competition:
  starting_capital_usd: 1_000_000     # spec value — re-confirm via exchangeInfo on competition day
  competition_end_utc: "2026-04-01T00:00:00Z"   # MUST SET before launch (ISO 8601)
  competition_start_utc: "2026-03-22T00:00:00Z"  # MUST SET before launch

# -----------------------------------------------------------------------------
# API — spec defaults, re-confirm on competition day (see contingency-15Mar.md)
# -----------------------------------------------------------------------------
api:
  base_url: "https://mock-api.roostoo.com"  # CONFIRMED
  key_env_var: "ROOSTOO_API_KEY"
  secret_env_var: "ROOSTOO_API_SECRET"
  rate_limit_calls_per_min: 30         # spec value — pre-competition empirical was 50/sec (see contingency)
  rate_limit_reserve_headroom: 10      # reserve for orders + retries
  batch_pricing_available: true        # CONFIRMED: /v3/ticker with no pair returns all tickers
  limit_fills_immediately: true        # needs credential test on competition day
  volume_data_available: true          # CONFIRMED: CoinTradeValue + UnitTradeValue fields
  backoff_429_max_sec: 30              # exponential backoff ceiling
  safe_mode_consecutive_429s: 5        # enter safe mode after N consecutive 429s

  # Phase 0 confirmed API response field names:
  #   exchangeInfo → { IsRunning, InitialWallet: {USD: N}, TradePairs: {pair: {Coin, CoinFullName, Unit, UnitFullName, CanTrade, PricePrecision, AmountPrecision, MiniOrder}} }
  #   ticker → { Success, ErrMsg, ServerTime, Data: {pair: {MaxBid, MinAsk, LastPrice, Change, CoinTradeValue, UnitTradeValue}} }
  #   serverTime → { ServerTime }
  #   67 pairs on API, 54 in our universe, 13 extra available (AVAX, SOL, XRP, etc.)
  #   Bid-ask spread ~$0.01 on BTC — effectively zero on mock exchange
  #   Content-Type is text/plain (not application/json) — parse via text then json.loads

# -----------------------------------------------------------------------------
# UNIVERSE — asset tier classification
# -----------------------------------------------------------------------------
universe:
  tier_1_majors:
    - BTC
    - ETH
    - BNB
    - LTC
    - ADA
    - DOGE
    - TRX
  tier_2_large_alts:
    - LINK
    - DOT
    - NEAR
    - TON
    - SUI
    - APT
    - ARB
    - HBAR
    - ICP
    - SEI
    - S
  tier_3_defi:
    - AAVE
    - UNI
    - CRV
    - PENDLE
    - ONDO
    - ENA
    - FET
    - CAKE
    - EIGEN
    - CFX
    - FIL
    - ZEC
    - ZEN
  tier_4_meme:
    - SHIB
    - PEPE
    - FLOKI
    - WIF
    - BONK
    - 1000CHEEMS
    - PUMP
    - PENGU
  tier_5_obscure:
    - SOMI
    - AVNT
    - MIRA
    - EDEN
    - FORM
    - LINEA
    - LISTA
    - OPEN
    - BMT
    - ASTER
    - STO
    - WLD
    - POL
  special:
    paxg: "PAXG"
    trump: "TRUMP"
  pair_suffix: "/USD"

# -----------------------------------------------------------------------------
# TIER CAPS — max single-position weight as fraction of NAV
# -----------------------------------------------------------------------------
tier_caps:
  tier_1_2: 0.08
  tier_3: 0.06
  tier_4_meme: 0.03
  tier_5_obscure: 0.02
  doge: 0.05          # Tier 1 but capped lower due to meme-tier volatility
  trump: 0.02         # political event risk
  paxg: 0.15          # Treynor instrument
  redistribution_max_iterations: 5  # cap-and-redistribute loop limit

# -----------------------------------------------------------------------------
# DATA INGESTION (Layer 1)
# -----------------------------------------------------------------------------
data_ingestion:
  price_cadence_sec: 60                # batch price fetch every 60s
  balance_cadence_sec: 300             # balance check every 5 min + after trades
  ring_buffer_maxlen: 1440             # 24h of 1-min bars per asset
  missing_bar_fill_forward_limit: 3    # fill forward up to 3 bars, then STALE
  price_anomaly_threshold_std: 5.0     # flag if single-bar return > 5σ of 1h vol
  stale_data_max_age_sec: 300          # no new trades on data older than 5 min
  heartbeat_stale_threshold_sec: 180   # alert if heartbeat > 3 min old

# -----------------------------------------------------------------------------
# FEATURE ENGINEERING (Layer 2)
# -----------------------------------------------------------------------------
features:
  computation_timeout_sec: 5           # must complete within 5s of bar close

  # return windows (in 1-min bars)
  return_windows:
    - 5       # 5 min
    - 15      # 15 min
    - 60      # 1h
    - 240     # 4h
    - 720     # 12h
    - 1440    # 24h

  # EMA periods (in 1-min bars)
  ema_periods:
    fast: 20
    medium: 50
    trend_fast: 60     # EMA(60) for trend filter
    trend_slow: 240    # EMA(240) for trend filter

  # cross-sectional momentum composite weights (must sum to 1.0)
  momentum_composite_weights:
    rank_1h: 0.20
    rank_4h: 0.40
    rank_12h: 0.25
    rank_24h: 0.15

  # volatility windows
  volatility_windows:
    - 60      # 1h
    - 240     # 4h
    - 1440    # 24h

  # BTC vol percentile
  btc_vol_percentile_lookback_days: 7
  btc_vol_percentile_sample_interval_min: 5

  # ML feature normalization (Phase 3 only)
  ml_zscore_lookback: 100

# -----------------------------------------------------------------------------
# REGIME DETECTION (Layer 3)
# -----------------------------------------------------------------------------
regime:
  update_cadence_sec: 300              # regime classification every 5 min

  # classification thresholds
  thresholds:
    contagion_ratio_crisis: 0.80       # > 80% positions down
    contagion_avg_loss_pct: 0.01       # AND avg 5-min loss > 1%
    btc_vol_percentile_crisis: 90      # BTC vol > 90th percentile → CRISIS
    altcoin_breadth_bull: 0.55         # breadth > 55% → BULL component
    altcoin_breadth_bear: 0.40         # breadth < 40% → BEAR component

  # transition rules
  transitions:
    upgrade_confirmation_bars: 30      # 30 min of sustained upgrade signal
    crisis_exit_contagion_below: 0.50  # contagion must drop below 50%
    crisis_exit_vol_below: 70          # BTC vol percentile must drop below 70
    crisis_exit_confirmation_bars: 30  # 30 min sustained before exiting CRISIS

  # contagion proxy
  contagion_return_window_min: 5       # 5-min return window for held positions

# -----------------------------------------------------------------------------
# SIGNAL GENERATION (Layer 4)
# -----------------------------------------------------------------------------
signals:
  # momentum top-N selections by regime
  top_n_selections:
    trend_bull: 10
    mean_revert: 6
    trend_bear: 4
    crisis: 0

  # turnover buffer (Hysteresis N+3)
  hysteresis_buffer: 3

  # volatility exclusion filter (Phase 1)
  vol_exclusion_multiplier: 2.0

  # sentiment overlay (Binance Funding)
  sentiment_overlay_enabled: true
  sentiment_crowded_penalty: -0.15
  sentiment_reversal_bonus: 0.10

  # trend penalty (Phase 2+)
  trend_penalty_magnitude: -0.30       # in cross-sectional rank std deviations

  # meme pool (Phase 2+)
  meme_pool:
    allocation_pct: 0.03               # 3% NAV per selected meme coin
    max_selections: 2                  # top 1-2 meme coins
    trailing_stop_pct: 0.08            # 8% trailing stop
    active_regimes:
      - TREND_BULL

  # Tier 5 opportunistic pool (Phase 2+)
  tier5_pool:
    activation_4h_return_threshold: 0.10  # 4h return > 10% required
    activation_rank_top_n: 3              # must be in top 3 of Tier 5
    allocation_pct_min: 0.01              # 1% NAV min
    allocation_pct_max: 0.02              # 2% NAV max
    max_selections: 2                     # top 1-2 qualifying assets
    trailing_stop_pct: 0.08              # 8% trailing stop
    active_regimes:
      - TREND_BULL

  # ML overlay (Phase 3 only)
  ml:
    enabled: false
    multiplier_high: 1.3                  # P > threshold_high → 1.3x
    multiplier_low: 0.5                   # P < threshold_low → 0.5x
    multiplier_default: 1.0               # otherwise → 1.0x
    probability_threshold_high: 0.65
    probability_threshold_low: 0.45
    ic_halt_threshold: 0.02               # halt if rolling 48h IC < 0.02
    ic_resume_threshold: 0.04             # resume when IC > 0.04
    ic_resume_window_hr: 12               # for 12 continuous hours

# -----------------------------------------------------------------------------
# PORTFOLIO CONSTRUCTION (Layer 5)
# -----------------------------------------------------------------------------
portfolio:
  # regime-conditional deployment targets (fraction of NAV in crypto)
  regime_targets:
    trend_bull_low_vol: 0.80             # 75-85%, default midpoint
    trend_bull_high_vol: 0.65            # 60-70%, default midpoint
    mean_revert: 0.55                    # 50-60%, default midpoint
    trend_bear: 0.35                     # 30-40%, default midpoint
    crisis: 0.15                         # 10-20%, default midpoint

  # BTC vol percentile threshold separating low_vol and high_vol within BULL
  btc_vol_high_vol_threshold: 70

  # hard cap on total crypto exposure (never exceeded, even with adaptive adj)
  max_crypto_exposure: 0.90

  # PAXG allocation (from cash buffer, by regime)
  paxg_allocation:
    trend_bull: 0.05
    mean_revert: 0.10
    trend_bear: 0.12
    crisis: 0.15
    hard_cap: 0.15

  # adaptive exposure adjustment (Phase 2+)
  adaptive_exposure:
    enabled: false                       # enable in Phase 2
    naive_benchmark_exposure: 0.70       # equal-weight 70% to all assets
    gap_threshold_small: 0.02            # 2% behind → +10% floor
    gap_threshold_large: 0.04            # 4% behind → +20% floor
    adjustment_small: 0.10
    adjustment_large: 0.20
    min_days_remaining_small: 5          # only adjust if >5 days left
    min_days_remaining_large: 3          # only adjust if >3 days left

  # BTC beta targeting (Phase 2+)
  beta_targeting:
    enabled: false                       # enable in Phase 2
    target_trend_bull_min: 0.40
    target_trend_bull_max: 0.60
    target_other_max: 0.30
    adjustment_trigger_above: 0.10       # adjust if beta exceeds target by > 0.1
    regression_window_days: 7
    benchmarks:
      - "BTC"
      - "equal_weighted"

  # turnover constraint
  max_turnover_per_rebalance: 0.25       # 25% one-way

  # minimum trade threshold
  min_trade_threshold_pct_nav: 0.002     # 0.2% of NAV = $2,000 at start

  # rebalance cadence
  rebalance_cadence_sec: 3600          # C-03: corrected from 120 (2 min) to avoid commission drag

# -----------------------------------------------------------------------------
# END-GAME DE-RISKING (Layer 5, hardcoded schedule)
# -----------------------------------------------------------------------------
endgame:
  # each entry: hours remaining → max crypto exposure cap
  schedule:
    - hours_remaining: 48
      max_exposure: 0.70
      stop_override: null                # no stop tightening yet
    - hours_remaining: 24
      max_exposure: 0.45
      stop_override: null
    - hours_remaining: 12
      max_exposure: 0.25
      stop_override: 0.03               # tighten all stops to 3%
    - hours_remaining: 4
      max_exposure: 0.15
      stop_override: 0.02               # tighten all stops to 2%
    - hours_remaining: 1
      max_exposure: 0.15
      stop_override: 0.02
  # final forced sell
  final_sell_minutes_remaining: 15       # sell ALL at T-15min

# -----------------------------------------------------------------------------
# RISK MANAGEMENT (Layer 6)
# -----------------------------------------------------------------------------
risk:
  # portfolio-level hard limits
  portfolio_limits:
    drawdown_soft_warning: 0.05          # 5% drawdown → log warning
    drawdown_hard_halt: 0.08             # 8% drawdown → HALT new entries
    daily_loss_soft_warning: 0.03        # 3% daily loss → log warning
    daily_loss_hard_reduce: 0.05         # 5% daily loss → reduce to 50%
    crypto_exposure_soft_warning: 0.85
    crypto_exposure_hard_sell: 0.90
    single_asset_loss_soft: 0.04         # 4% loss from entry → warning
    single_asset_loss_hard: 0.06         # 6% loss from entry → close

  # trailing stops (base distances)
  trailing_stops:
    tier_1_3: 0.06                       # 6% below peak
    tier_4_5: 0.08                       # 8% below peak (meme + obscure)
    trump: 0.10                          # 10% below peak
    minimum_floor: 0.02                  # NEVER below 2%, even with tightening

  # dynamic trailing stop tightening (based on daily P&L)
  stop_tightening:
    # daily P&L > +2% → tighten stops by 40%
    threshold_high_pnl: 0.02
    tightening_high: 0.40
    # daily P&L +1% to +2% → tighten by 20%
    threshold_medium_pnl: 0.01
    tightening_medium: 0.20
    # daily P&L < +1% → normal stops
    # daily P&L < -0.5% → circuit breakers handle it

  # drawdown recovery
  drawdown_recovery:
    halt_cooldown_hr: 2                  # no new buys for 2 hours
    resume_sizing_fraction: 0.50         # resume at 50% size
    full_sizing_within_pct_of_peak: 0.04 # full size when within 4% of peak

  # contagion circuit breaker
  contagion:
    ratio_threshold: 0.80
    avg_loss_threshold_pct: 0.01
    position_reduction_to: 0.20          # reduce all positions to 20% of size

  # risk check cadence
  check_cadence_sec: 60                  # every 1 minute

# -----------------------------------------------------------------------------
# EXECUTION ENGINE (Layer 7)
# -----------------------------------------------------------------------------
execution:
  order_timeout_sec: 60                  # 1-min fill timeout, then cancel+resubmit
  max_resubmissions: 3                   # max resubmit attempts per order
  risk_exit_acceleration_threshold: 0.02 # >2% adverse → escalate after 1 failed
  max_simultaneous_orders: 15            # order queue limit
  fill_check_delay_sec: 5               # query order status after 5s

# -----------------------------------------------------------------------------
# ADAPTATION & MONITORING (Layer 8)
# -----------------------------------------------------------------------------
adaptation:
  # signal health monitoring
  signal_health:
    check_cadence_hr: 1
    hit_rate_window_hr: 24
    hit_rate_warning: 0.45
    hit_rate_halt: 0.35
    hit_rate_halt_sustained_hr: 12       # must be below for 12h to halt
    halted_exposure_cap: 0.30
    halted_keep_top_positions: 3
    resume_hit_rate: 0.50
    resume_window_hr: 6
    winner_loser_warning: 0.80
    winner_loser_halt: 0.50

  # signal decay monitoring (informational)
  signal_decay:
    high_decay_difference_threshold: 0.05  # 30-min corr > 60-min by 0.05

  # performance snapshots
  performance_snapshot_cadence_hr: 1

  # crash recovery parquet backup
  parquet_backup_cadence_hr: 1

# -----------------------------------------------------------------------------
# ML RETRAINING (Layer 8, Phase 3 only)
# -----------------------------------------------------------------------------
ml_retrain:
  enabled: false                         # enable in Phase 3
  cadence_hr: 24                         # retrain every 24h
  training_lookback_days: 60             # 60+ days of historical data
  target: "sign_4h_return"               # binary classification target
  hyperparameters:
    max_depth: 6
    min_child_samples: 50
    feature_fraction: 0.7
    n_estimators: 500
    early_stopping_rounds: 50
  sanity_check:
    data_window_min: 5                   # run new model on last 5 min of data
    std_threshold: 2.0                   # reject if distribution differs >2σ
  historical_data_path: "data/historical_ohlcv.parquet"
  model_save_path: "models/lightgbm_latest.pkl"

# -----------------------------------------------------------------------------
# PHASE 1 — MINIMAL VOL GUARD (used before Phase 2 regime detection)
# -----------------------------------------------------------------------------
phase1_vol_guard:
  btc_30d_median_vol: 0.0              # MUST SET — compute from Binance history
  vol_spike_multiplier: 2.0             # if BTC 24h vol > 2× median → defensive
  defensive_max_exposure: 0.40          # cap at 40% in defensive mode
  normal_max_exposure: 0.75             # 75% in normal mode

# -----------------------------------------------------------------------------
# ORCHESTRATION
# -----------------------------------------------------------------------------
orchestration:
  data_ingestion_timeout_sec: 10         # ingestion + features must finish in 10s
  minimum_activity_check_hr: 24          # force trade if none in 24h
  job_overlap_warning: true              # log JOB_OVERLAP if job still running
  max_consecutive_failures: 3            # enter global safe state after 3 failures

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
logging:
  level: "DEBUG"
  directory: "logs"
  main_log: "logs/apex.log"
  trade_log: "logs/trades.jsonl"
  snapshot_log: "logs/snapshots.jsonl"
  snapshots_log: "logs/snapshots.jsonl"          # C-02: code accesses snapshots_log (trailing s); keep both for compat
  daily_returns_log: "logs/daily_returns.jsonl"  # C-01: required by PerformanceLogger; was missing
  heartbeat_file: "logs/heartbeat"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

# -----------------------------------------------------------------------------
# DEBUG TICK — temporary price heartbeat logged every 60s
# Set enabled: false before competition
# -----------------------------------------------------------------------------
debug_tick:
  enabled: true
  watch_assets:          # any subset of the 67 tickers
    - BTC
    - ETH
    - SOL
    - DOGE

# -----------------------------------------------------------------------------
# PATHS
# -----------------------------------------------------------------------------
paths:
  parquet_backup: "data/price_backup.parquet"
  historical_data: "data/historical_ohlcv.parquet"
  model_dir: "models/"

# -----------------------------------------------------------------------------
# RANDOM SEEDS (for reproducibility)
# -----------------------------------------------------------------------------
random_seeds:
  numpy: 42
  lightgbm: 42

# ============================================================
# PHASE 2 PARAMETERS
# ============================================================

regime:
  btc_symbol: "BTC"
  breadth_bull_threshold: 0.55         # fraction of altcoins positive (4h)
  breadth_bear_threshold: 0.40
  contagion_ratio_threshold: 0.80
  contagion_loss_threshold: 0.01       # 1% avg 5min loss
  contagion_small_portfolio_size: 6
  contagion_small_ratio_threshold: 0.90
  contagion_small_loss_threshold: 0.015
  btc_vol_crisis_percentile: 90
  upgrade_persistence_minutes: 30
  crisis_exit_persistence_minutes: 30

trend_penalty:
  ema_short_period: 60                 # minutes
  ema_long_period: 240
  penalty_sigma: -0.3
  broad_downturn_threshold: 0.70       # fraction of universe with bearish EMA
  broad_downturn_penalty_sigma: -0.15

meme_pool:
  enabled: true
  symbols: ["SHIB", "PEPE", "FLOKI", "WIF", "BONK", "PUMP", "PENGU"]
  max_allocation_per_coin: 0.03
  top_n: 2
  active_regimes: ["TREND_BULL"]
  trailing_stop_pct: 0.08

dynamic_stops:
  tighten_high_threshold: 0.05         # unrealized PnL above this: heavy tighten
  tighten_high_factor: 0.60            # multiply base stop by this (40% tighter)
  tighten_mid_threshold: 0.025         # unrealized PnL above this: moderate tighten
  tighten_mid_factor: 0.80             # multiply base stop by this (20% tighter)
  min_stop_floor: 0.02                 # absolute minimum stop: 2%

paxg:
  symbol: "PAXG"
  allocation:
    TREND_BULL: 0.04                   # midpoint of [0.03, 0.05]
    MEAN_REVERT: 0.075                 # midpoint of [0.05, 0.10]
    TREND_BEAR: 0.125                  # midpoint of [0.10, 0.15]
    HIGH_VOL_CRISIS: 0.125             # midpoint of [0.10, 0.15]
  rebalance_tolerance: 0.01            # don't rebalance if within 1% of target

endgame:
  schedule:
    - { hours_remaining: 48, max_exposure: 1.0, stop_override: null }
    - { hours_remaining: 24, max_exposure: 0.70, stop_override: null }
    - { hours_remaining: 12, max_exposure: 0.45, stop_override: null }
    - { hours_remaining: 4, max_exposure: 0.25, stop_override: 0.03 }
    - { hours_remaining: 1, max_exposure: 0.15, stop_override: 0.02 }
    - { hours_remaining: 0.25, max_exposure: 0.0, stop_override: null }
  round_end_utc: "2026-03-31T23:59:00Z"

portfolio:
  exposure:
    TREND_BULL: 0.80                   # midpoints, not ranges
    TREND_BULL_RISING_VOL: 0.65
    MEAN_REVERT: 0.55
    TREND_BEAR: 0.35
    HIGH_VOL_CRISIS: 0.15
  holdings:
    TREND_BULL: 10
    MEAN_REVERT: 6
    TREND_BEAR: 4
    HIGH_VOL_CRISIS: 0
  turnover_max_pct: 0.25
  min_trade_nav_pct: 0.002
  tier_caps:
    tier1: 0.08
    tier1_doge: 0.05
    tier2: 0.08
    tier3: 0.06
    tier4_meme: 0.03
    tier5: 0.02
    trump: 0.02
    paxg: 0.15